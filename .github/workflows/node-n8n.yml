name: n8n Node Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/n8n-nodes-insign/**'
      - '.github/workflows/node-n8n.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/n8n-nodes-insign/**'
      - '.github/workflows/node-n8n.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  n8n-node:
    name: n8n-nodes-insign tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/n8n-nodes-insign

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/n8n-nodes-insign/package-lock.json

      # --ignore-scripts: eslint-plugin-n8n-nodes-base ships a preinstall
      # `npx only-allow pnpm` guard that aborts a plain `npm ci`. We don't need
      # any dependency lifecycle scripts to build/lint/test this package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build + unit tests
        run: npm test
