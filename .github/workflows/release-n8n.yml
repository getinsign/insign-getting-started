name: Publish n8n-nodes-insign

# Publishes src/n8n-nodes-insign to npm when a tag like
# `n8n-nodes-insign-v1.0.0` is pushed. Requires an NPM_TOKEN repo secret
# (automation token with publish rights for the n8n-nodes-insign package).
on:
  push:
    tags:
      - 'n8n-nodes-insign-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/n8n-nodes-insign

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: src/n8n-nodes-insign/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build + unit tests
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
